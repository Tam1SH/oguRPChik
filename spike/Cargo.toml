[package]
name    = "capnp-compio-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
compio       = { version = "0.18.0", features = ["net", "io-compat", "macros", "time"] }
compio-io    = { version = "0.9.0", features = ["compat"] }
futures-util = "0.3"
capnp        = "0.27"
capnp-rpc    = "0.27"
capnp-futures = "0.27"

[build-dependencies]
capnpc = "0.27"
